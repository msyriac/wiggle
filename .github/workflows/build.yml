name: Build

on: [push, pull_request]

jobs:

  test-linux:
    name: "Run tests on Linux"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python: ["3.14", "3.13", "3.12", "3.11", "3.10"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run Tests (Linux)
        run: |
          python -m pip install --upgrade pip setuptools wheel meson ninja meson-python cython numpy scipy pybind11
          python -m pip install --no-build-isolation --editable '.[test]'
          pytest --cov --cov-report html --cov-report xml --cov-report annotate -sx --ignore-glob="*bmodes*.py"

      - uses: codecov/codecov-action@v5
        with:
          # v5 requires a repository upload token for reliable uploads:
          # add CODECOV_TOKEN under repo Settings -> Secrets and variables -> Actions.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true # optional (default = false)

  build_wheels_ubuntu:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # CPython + glibc only, for fast builds:
          #  - pp*          PyPy (opt-in by default in cibuildwheel v3, kept for clarity)
          #  - *-musllinux* Alpine/musl wheels
          #  - cp*t-*       free-threaded CPython builds (on by default for 3.14 in v3.x)
          # Note: cibuildwheel v3 also builds Python 3.14 wheels by default and
          # tags Linux wheels manylinux_2_28 (was manylinux2014 in v2).
          CIBW_SKIP: "pp* *-musllinux* cp*t-*"
          # Full meson/compiler output in the CI log; remove once builds are stable.
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_wheels_macos:
    name: Build ${{ matrix.cibw_arch }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon. macos-14 is the oldest available arm64 image, which
          # keeps the vendored libomp bottle as widely compatible as possible.
          - os: macos-14
            cibw_arch: arm64
          # Intel. macos-13 was retired in Dec 2025; macos-15-intel is the last
          # x86_64 image GitHub will offer (available through ~Aug 2027).
          - os: macos-15-intel
            cibw_arch: x86_64

    steps:
      - uses: actions/checkout@v4

      # ---------- 1 · OpenMP runtime only (no full LLVM toolchain) ---------- #
      - name: Install libomp
        run: |
          brew install libomp
          echo "LIBOMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      # ---------- 2 · build with Apple clang, vendor libomp INTO the wheel ---------- #
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_arch }}
          # CPython only, no free-threaded builds (see Linux job for details).
          CIBW_SKIP: "pp* cp*t-*"
          # Full meson/compiler output in the CI log; remove once builds are stable.
          CIBW_BUILD_VERBOSITY: 1

          # Apple clang requires -Xpreprocessor to accept -fopenmp.
          # This mirrors scikit-learn / xgboost's macOS wheel builds.
          CIBW_ENVIRONMENT_MACOS: |
            CC=/usr/bin/clang
            CXX=/usr/bin/clang++
            CPPFLAGS="-Xpreprocessor -fopenmp -I$LIBOMP_PREFIX/include"
            CFLAGS="-O3 -Xpreprocessor -fopenmp -I$LIBOMP_PREFIX/include"
            CXXFLAGS="-O3 -Xpreprocessor -fopenmp -I$LIBOMP_PREFIX/include"
            LDFLAGS="-Wl,-rpath,$LIBOMP_PREFIX/lib -L$LIBOMP_PREFIX/lib -lomp"

          # Default delocate behaviour: copy libomp into pywiggle/.dylibs and
          # rewrite the load command to @loader_path/.dylibs/libomp.dylib.
          # Do NOT add `-e libomp.dylib` here -- that produces a wheel that
          # only imports on a machine with Homebrew LLVM installed.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}

          MACOSX_DEPLOYMENT_TARGET: "13.0"

        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.cibw_arch }}
          path: wheelhouse/*.whl

  smoke_test_macos_wheels:
    name: Smoke-test ${{ matrix.cibw_arch }} wheel (clean runner)
    needs: [build_wheels_macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            cibw_arch: arm64
          - os: macos-15-intel
            cibw_arch: x86_64

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-macos*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This runner never ran `brew install`, so any un-vendored Homebrew
      # dependency fails here rather than after the wheel is on PyPI.
      - name: Install and import
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy threadpoolctl
          python -m pip install --no-index --find-links dist pywiggle
          python -c "import pywiggle; print(pywiggle.__file__)"

      - name: Check for build-machine library paths
        run: |
          SO=$(python -c "import pathlib,sysconfig;print(next(pathlib.Path(sysconfig.get_paths()['purelib'],'pywiggle').glob('_wiggle*.so')))")
          otool -L "$SO"
          if otool -L "$SO" | grep -qE '/opt/homebrew|/usr/local/opt'; then
            echo "::error::wheel references build-machine library paths; delocate did not vendor them"
            exit 1
          fi

      # Guard against silently shipping a serial build: importing pywiggle must
      # load an OpenMP runtime (the vendored libomp), and it must come from
      # inside the wheel, not from a system/Homebrew path.
      - name: Verify OpenMP threading is enabled
        run: |
          python - <<'EOF'
          import pywiggle
          from threadpoolctl import threadpool_info

          omp = [d for d in threadpool_info() if d.get("user_api") == "openmp"]
          for d in omp:
              print(f'{d["filepath"]}  (num_threads={d["num_threads"]})')

          assert omp, "No OpenMP runtime loaded: wheel was built without OpenMP support"
          assert any("pywiggle" in d["filepath"] for d in omp), \
              "OpenMP runtime loaded from outside the wheel; libomp was not vendored"
          EOF

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.10'

      - name: Build sdist
        run: |
          python -m pip install -U pip
          python -m pip install -U setuptools
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython numpy pybind11 scipy
          python -m pip install build
          python -m build . --sdist

      - name: Extract version from sdist filename
        id: get_version
        run: |
          FILE=$(ls dist/pywiggle-*.tar.gz | head -n1)
          VERSION=$(basename "$FILE" | sed -E 's/^pywiggle-([0-9a-zA-Z\.\-]+)\.tar\.gz$/\1/')
          echo "version=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels_ubuntu, build_sdist, build_wheels_macos, smoke_test_macos_wheels]
    runs-on: ubuntu-latest
    # upload to PyPI on every tag starting with 'v'
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    # alternatively, to publish when a GitHub Release is created, use the following rule:
    # if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "cibw-*"
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          # To test: repository_url: https://test.pypi.org/legacy/

  test-wheel:
    needs: [upload_pypi, build_sdist]
    name: "Run tests on ${{ matrix.os }} with uploaded wheels"
    runs-on: ${{ matrix.os }}
    continue-on-error: true

    env:
      VERSION: ${{ needs.build_sdist.outputs.version }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, macos-15-intel]
        python: ["3.14", "3.13", "3.12", "3.11", "3.10"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies and wheel from PyPI
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest ducc0 threadpoolctl scipy numpy pixell matplotlib
          echo "Installing pywiggle==$VERSION"

          MAX_WAIT=300   # seconds (5 minutes)
          INTERVAL=15    # seconds between retries
          ELAPSED=0

          until python -m pip install --only-binary :all: --no-cache-dir "pywiggle==${VERSION}"; do
          echo "Wheel not yet available. Retrying in $INTERVAL seconds..."
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
          if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
          echo "Timed out waiting for pywiggle==$VERSION to become available on PyPI."
          exit 1
          fi
          done

      - name: Run Tests
        run: |
          cd ~
          pytest --pyargs pywiggle.tests --ignore-glob="*bmodes*.py"
